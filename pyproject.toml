[project]
name = "semantic-layer-benchmark"
version = "0.1.0"
description = "Text-to-SQL benchmark: raw DDL vs raw DDL + semantic-layer markdown, across Claude (Opus/Sonnet) and GPT-5.4"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "clickhouse-connect>=0.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

