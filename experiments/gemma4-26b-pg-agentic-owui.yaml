experiment:
  name: gemma4-26b-pg-agentic-owui
  description: "Gemma 4 26B-A4B on PostgreSQL Contoso via Open WebUI native tool loop (REPORT.pg-gemma)"
  tags: [postgres, gemma4, agentic, openwebui]

engine:
  type: postgres
  dsn_env: PG_ADMIN_DSN
  exec_timeout_s: 30
  row_cap: 100

dataset:
  path: datasets/postgres/benchmark.json
  schema: datasets/postgres/schema.sql
  semantic_layer: datasets/postgres/semantic_layer.md

systems:
  - id: gemma4-26b__owui-raw
    label: "Gemma 4 26B raw (Open WebUI)"
    runner: openwebui
    mode: raw
    model: google/gemma-4-26B-A4B-it
    provider:
      url_env: OPENWEBUI_URL
      api_key_env: OPENWEBUI_API_KEY
      tool_id_env: OPENWEBUI_RUN_SQL_ADMIN_TOOL_ID
    params:
      timeout_s: 300
      keep_chats: false
    concurrency: 2

  - id: gemma4-26b__owui-semantic
    label: "Gemma 4 26B + Sem (Open WebUI)"
    runner: openwebui
    mode: semantic
    model: google/gemma-4-26B-A4B-it
    provider:
      url_env: OPENWEBUI_URL
      api_key_env: OPENWEBUI_API_KEY
      tool_id_env: OPENWEBUI_RUN_SQL_ADMIN_TOOL_ID
    params:
      timeout_s: 300
      keep_chats: false
    concurrency: 2

judge:
  runner: agy_cli
  model: claude-sonnet-5-5-medium
  concurrency: 5
  row_preview_limit: 10

lifecycle:
  before_run: infra/nebius/endpoint_up.sh --sync-openwebui --model google/gemma-4-26B-A4B-it
  after_run: infra/nebius/endpoint_down.sh
