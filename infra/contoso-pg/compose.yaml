# Benchmark database for the Open WebUI agentic runner.
#   docker compose -f docker/contoso/compose.yaml up -d --wait
# Joins Open WebUI's network so the run_sql Workspace Tool reaches it as
# contoso-pg:5432; the harness uses 127.0.0.1:5433 (PG_ADMIN_DSN in .env).
name: contoso

services:
  contoso-pg:
    # local build with updated initdb/10-restore.sh
    image: ${CONTOSO_IMAGE:-lohas1107/contoso:pg-cube-1.0.0}
    container_name: contoso-pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${CONTOSO_PG_PASSWORD:-contoso}
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD:-admin}
      PG_MARKETING_PASSWORD: ${PG_MARKETING_PASSWORD:-marketing}
    ports:
      - "127.0.0.1:5433:5432"
    shm_size: 1g
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "work_mem=64MB",
              "-c", "max_parallel_workers_per_gather=4"]
    volumes:
      - contoso-pg-data:/var/lib/postgresql/data
    networks: [default, openwebui]
    healthcheck:
      # ready only after the init restore finished and admin + marketing exist
      test: ["CMD-SHELL", "psql -U postgres -d contoso -tAc \"select count(*) from pg_roles where rolname in ('admin','marketing')\" | grep -q '^2$'"]
      interval: 5s
      retries: 120
      start_period: 30s

volumes:
  contoso-pg-data:

networks:
  openwebui:
    name: open-webui_default
    external: true
